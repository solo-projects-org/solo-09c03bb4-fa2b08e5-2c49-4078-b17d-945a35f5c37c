services:
  ais:
    build: .
    image: ais-track:local
    container_name: ais-track
    ports:
      - "${AIS_PORT:-8000}:8000"
    environment:
      AIS_DATA_DIR: /data
      AIS_MAX_UPLOAD_BYTES: "${AIS_MAX_UPLOAD_BYTES:-67108864}"
    volumes:
      - ais-data:/data
      - ./samples:/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  ais-data:
